name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIRECTORY: ${{ github.workspace }}/build

jobs:
  Build-Linux:
    name: Ubuntu / ${{ matrix.type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        type: [ Debug, Release ]
    env:
      CC: clang-18
      CXX: clang++-18
      CCACHE_COMPRESS: true
      CCACHE_MAX_SIZE: 5G
      CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y --no-install-recommends libclang-18-dev ccache ninja-build libwayland-dev libxkbcommon-dev xorg-dev 

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-clang-18-${{ matrix.type }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clang-18-${{ matrix.type }}-cache-

      - name: Prepare ccache
        run: |
          mkdir -p ~/.ccache
          ccache -z       
          ccache -M 5G
          ccache -s     

      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
                   if [ "${{ matrix.type }}" == "Debug" ]; then
                     EXTRA_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
                  else
                    # Strip absolute paths from LTO to avoid ccache cache misses.
                    EXTRA_FLAGS="-ffile-prefix-map=${{ github.workspace }}=."
                   fi

                   # Use lld (bundled with clang-18) instead of mold to save setup action time.
                   # lld is exceptionally fast and fully supports LTO for Release builds.
                   cmake -G Ninja -B build \
                     -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
                     -DCMAKE_C_COMPILER=${{ env.CC }} \
                     -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
                     -DCMAKE_C_FLAGS="$EXTRA_FLAGS" \
                     -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
                     -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                     -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                     -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
                     -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
                     -DBALLISTIC_BUILD_TESTS=ON \
                     -DBALLISTIC_ENABLE_LINK_TIME_OPTIMIZATION=${{ matrix.type == 'Release' && 'ON' || 'OFF' }}

      - name: Build Project
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ccache -z
          cmake --build build --config ${{ matrix.type }} --target all -j$(nproc)
          ccache -s

      - name: Run Test Suite
        working-directory: build
        run: |
          ctest -C ${{ matrix.type }} --output-on-failure -j${{ env.NUMBER_OF_PROCESSORS }}
  

  Build-Windows:
    name: Windows / ${{ matrix.type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        type: [ Debug, Release ]
    env:
      CC: cl
      CXX: cl
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
      CMAKE_C_FLAGS: "/MP /Zf"
      CMAKE_CXX_FLAGS: "/MP /Zf"
      CMAKE_C_FLAGS_RELEASE: "/GL /O2"
      CMAKE_CXX_FLAGS_RELEASE: "/GL /O2"
      CMAKE_EXE_LINKER_FLAGS_RELEASE: "/LTCG:incremental /OPT:REF /OPT:ICF"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Dependencies
        shell: pwsh
        run: |
          if (!(Test-Path "$env:USERPROFILE\.choco-cache")) {
            New-Item -ItemType Directory -Path "$env:USERPROFILE\.choco-cache" -Force | Out-Null
          }
          choco install sccache -y --limit-output --cache-location="$env:USERPROFILE\.choco-cache"

      - name: Setup sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ runner.os }}-msvc-${{ matrix.type }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msvc-${{ matrix.type }}-sccache-

      - name: Disable Windows Defender Scanning
        shell: pwsh
        run: |
          $buildPath = "${{ github.workspace }}\build"
          if (!(Test-Path $buildPath)) { New-Item -ItemType Directory -Path $buildPath -Force | Out-Null }
          Add-MpPreference -ExclusionPath $buildPath -ErrorAction SilentlyContinue
          Write-Host "✓ Build directory excluded from Windows Defender"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -G Ninja -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.type }} `
            -DCMAKE_C_COMPILER=${{ env.CC }} `
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-link" `
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld-link" `
            -DBALLISTIC_BUILD_TESTS=ON `
            -DBALLISTIC_ENABLE_LINK_TIME_OPTIMIZATION=${{ matrix.type == 'Release' && 'ON' || 'OFF' }} `

      - name: Build Project
        shell: pwsh
        run: |
          sccache --zero-stats
          cmake --build build --config ${{ matrix.type }} --target all -j${{ env.NUMBER_OF_PROCESSORS }}
          sccache --show-stats

      - name: Run Test Suite
        working-directory: build
        shell: pwsh
        run: |
          ctest -C ${{ matrix.type }} --output-on-failure -j ${{ env.NUMBER_OF_PROCESSORS }}

  Build-macOS:
    name: macOS / ${{ matrix.type }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        type: [ Debug, Release ]
    env:
      CC: clang
      CXX: clang++
      CCACHE_COMPRESS: true
      CCACHE_MAX_SIZE: 5G
      CCACHE_SLOPPINESS: time_macros,include_file_ctime,include_file_mtime,locale
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: brew install ccache ninja

      - name: Setup Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-clang-${{ matrix.type }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clang-${{ matrix.type }}-ccache-

      - name: Prepare ccache
        run: |
          mkdir -p ~/.ccache
          ccache -z
          ccache -M 5G
          ccache -s

      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.type }}" == "Debug" ]; then
            EXTRA_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O0"
          else
            EXTRA_FLAGS="-ffile-prefix-map=${{ github.workspace }}=. -O3"
          fi
          
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            -DCMAKE_C_COMPILER=${{ env.CC }} \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_C_FLAGS="$EXTRA_FLAGS" \
            -DCMAKE_CXX_FLAGS="$EXTRA_FLAGS" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBALLISTIC_BUILD_TESTS=ON \

      - name: Build Project
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ccache -z
          # sysctl dynamically grabs all available M1 cores
          cmake --build build --config ${{ matrix.type }} --target all -j$(sysctl -n hw.ncpu)
          ccache -s

      - name: Run Test Suite
        working-directory: build
        run: |
          ctest -C ${{ matrix.type }} --output-on-failure -j$(sysctl -n hw.ncpu)